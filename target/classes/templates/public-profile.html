<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" style="max-width:700px;margin:0 auto;">

    <div style="margin-bottom:1.5rem;">
        <a href="javascript:history.back()"
           style="display:inline-flex;align-items:center;gap:.4rem;color:#667eea;text-decoration:none;
                  font-size:.85rem;font-weight:500;padding:.4rem .9rem;border:1px solid #dde1f0;
                  border-radius:8px;background:#f8f9ff;">
            ← Back
        </a>
    </div>

    <div style="display:flex;align-items:center;gap:2rem;background:#fff;border-radius:12px;padding:2rem;box-shadow:0 2px 10px rgba(0,0,0,.1);">
        <div style="width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);
                    display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:3rem;"
             th:text="${#strings.substring(user.name,0,1)}"></div>
        <div>
            <h2 style="color:#333;font-size:2rem;margin-bottom:.3rem;" th:text="${user.name}+' '+${user.surname}"></h2>
            <p style="color:#666;font-size:1rem;margin:0;"
               th:text="${user.driver} ? 'Driver' : 'Passenger'"></p>
            <p style="color:#888;font-size:.9rem;margin:.3rem 0 0;"
               th:if="${user.city != null}" th:text="${user.city.name}"></p>
        </div>
    </div>

    <div style="margin:2rem 0;text-align:center;">
        <div th:with="rounded=${T(java.lang.Math).round(avgRating)}">
            <span th:each="i : ${#numbers.sequence(1,5)}"
                  th:text="${i <= rounded} ? '★' : '☆'"
                  th:style="${i <= rounded} ? 'font-size:2rem;color:#f59e0b;' : 'font-size:2rem;color:#d1d5db;'"></span>
        </div>
        <div style="color:#64748b;font-size:0.9rem;margin-top:0.3rem;"
             th:text="${avgRating > 0} ? ${#numbers.formatDecimal(avgRating, 1, 1)} + ' / 5' : 'No ratings yet'"></div>
    </div>

    <div style="margin-top:1.5rem;">
        <h3 style="font-size:1rem;font-weight:700;color:#1e293b;margin-bottom:.75rem;">Reviews</h3>
        <div th:if="${#lists.isEmpty(receivedReviews)}"
             style="color:#94a3b8;font-size:.85rem;padding:.5rem 0;">No reviews yet.</div>
        <div th:each="r : ${receivedReviews}"
             style="background:#fff;border:1px solid #e8ecf5;border-radius:10px;padding:.9rem 1rem;margin-bottom:.6rem;">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;">
                <div style="display:flex;align-items:center;gap:.6rem;">
                    <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);
                                display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.9rem;flex-shrink:0;"
                         th:text="${#strings.substring(r.sender.name,0,1)}"></div>
                    <span style="font-weight:700;color:#1e293b;font-size:.9rem;"
                          th:text="${r.sender.name + ' ' + r.sender.surname}"></span>
                </div>
                <div style="font-size:1.3rem;letter-spacing:1px;">
                    <span th:each="i : ${#numbers.sequence(1,5)}"
                          th:text="${i <= r.starRating.value} ? '★' : '☆'"
                          th:style="${i <= r.starRating.value} ? 'color:#f59e0b' : 'color:#d1d5db'"></span>
                </div>
            </div>
            <div th:if="${r.comment}"
                 style="margin-top:.5rem;color:#475569;font-size:.88rem;background:#f8fafc;
                        border-radius:6px;padding:.4rem .7rem;border-left:3px solid #667eea;"
                 th:text="${r.comment}"></div>
        </div>
    </div>

</div>
</body>
</html>
