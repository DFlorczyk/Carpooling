<div th:fragment="content" xmlns:th="http://www.w3.org/1999/xhtml">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        .rr-wrap { max-width: 1100px; margin: 0 auto; }

        .rr-columns { display: flex; gap: 1.5rem; align-items: flex-start; }
        .rr-list-panel { flex: 0 0 400px; display: flex; flex-direction: column; gap: 1rem; }
        .rr-map-panel  { flex: 1; min-width: 0; }

        .back-btn {
            display: inline-flex; align-items: center; gap: .4rem;
            color: #667eea; text-decoration: none; font-size: .85rem; font-weight: 500;
            padding: .4rem .9rem; border: 1px solid #dde1f0; border-radius: 8px;
            background: #f8f9ff; margin-bottom: 1.25rem; transition: background .15s;
        }
        .back-btn:hover { background: #eef0fb; border-color: #667eea; }

        .page-title { font-size: 1.15rem; font-weight: 700; color: #1e293b; margin-bottom: 1rem; }

        .req-card {
            border: 1px solid #e8ecf5; border-radius: 12px;
            box-shadow: 0 2px 10px rgba(102,126,234,.07); overflow: hidden;
            cursor: pointer; transition: border-color .15s;
        }
        .req-card:hover { border-color: #667eea; }
        .req-card.selected { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,.15); }

        .req-card-header {
            padding: .65rem 1rem;
            background: linear-gradient(135deg, rgba(102,126,234,.08), rgba(118,75,162,.06));
            border-bottom: 1px solid #e8ecf5;
            display: flex; align-items: center; gap: .5rem;
            font-size: .85rem; font-weight: 600; color: #1e293b;
        }

        .req-card-body { padding: .9rem 1rem; font-size: .82rem; color: #555; display: flex; flex-direction: column; gap: .4rem; }

        .req-loc { display: flex; align-items: flex-start; gap: .5rem; }
        .req-loc-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; }

        .req-actions { display: flex; gap: .5rem; padding: .75rem 1rem; border-top: 1px solid #f1f5f9; }
        .btn-accept, .btn-reject {
            flex: 1; padding: .4rem; border: none; border-radius: 8px;
            font-size: .82rem; font-weight: 600; cursor: pointer; transition: opacity .15s;
        }
        .btn-accept { background: #22c55e; color: #fff; }
        .btn-reject { background: #ef4444; color: #fff; }
        .btn-accept:hover, .btn-reject:hover { opacity: .85; }

        .empty-msg { color: #94a3b8; font-size: .88rem; text-align: center; padding: 2rem 1rem; }

        .map-card { border: 1px solid #e8ecf5; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(102,126,234,.08); }
        .map-header {
            padding: .6rem 1rem; background: rgba(102,126,234,.05); border-bottom: 1px solid #e8ecf5;
            font-size: .75rem; font-weight: 600; color: #667eea;
            text-transform: uppercase; letter-spacing: .06em;
            display: flex; align-items: center; gap: .4rem;
        }

        .feedback-msg {
            padding: .6rem .9rem; border-radius: 8px; font-size: .82rem; margin-bottom: .5rem;
        }
        .feedback-msg.success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .feedback-msg.error   { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
        .d-none { display: none !important; }
    </style>

    <div class="rr-wrap">
        <a th:href="'/rides/' + ${ride.id}" class="back-btn">
            <i class="bi bi-arrow-left"></i> Back to Ride
        </a>

        <div class="page-title">Applications for this ride</div>

        <div id="feedbackMsg" class="feedback-msg d-none"></div>

        <div class="rr-columns">
            <div class="rr-list-panel" id="requestList">
                <div class="empty-msg">Loading...</div>
            </div>

            <div class="rr-map-panel">
                <div class="map-card">
                    <div class="map-header"><i class="bi bi-map"></i> Route &amp; Application Points</div>
                    <div id="map" style="height: 520px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="'https://maps.googleapis.com/maps/api/js?key=' + ${googleMapsApiKey} + '&callback=initMap'" async defer></script>

    <script th:inline="javascript">
        const RIDE_ID    = /*[[${ride.id}]]*/ 0;
        const RIDE_START = { lat: /*[[${ride.startLatitude}]]*/ 0, lng: /*[[${ride.startLongitude}]]*/ 0 };
        const RIDE_END   = { lat: /*[[${ride.endLatitude}]]*/ 0,   lng: /*[[${ride.endLongitude}]]*/ 0 };

        let map, directionsService, directionsRenderer;
        let requestMarkers = [];
        let requests = [];

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                zoom: 7,
                center: { lat: (RIDE_START.lat + RIDE_END.lat) / 2, lng: (RIDE_START.lng + RIDE_END.lng) / 2 },
                mapTypeControl: false, streetViewControl: false
            });

            directionsService  = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({
                map, suppressMarkers: false,
                polylineOptions: { strokeColor: '#667eea', strokeWeight: 5 }
            });

            directionsService.route({
                origin: RIDE_START, destination: RIDE_END,
                travelMode: google.maps.TravelMode.DRIVING
            }, (result, status) => {
                if (status === 'OK') directionsRenderer.setDirections(result);
            });

            loadRequests();
        }

        function loadRequests() {
            fetch(`/api/rides/${RIDE_ID}/requests`)
                .then(r => r.json())
                .then(data => {
                    requests = data;
                    renderList(data);
                    renderMarkers(data);
                })
                .catch(() => {
                    document.getElementById('requestList').innerHTML =
                        '<div class="empty-msg">Failed to load applications.</div>';
                });
        }

        const geocoder = new google.maps.Geocoder();
        function geocodeLatLng(lat, lng) {
            return new Promise(resolve => {
                geocoder.geocode({ location: { lat, lng } }, (results, status) => {
                    resolve(status === 'OK' && results[0] ? results[0].formatted_address : `${lat.toFixed(4)}, ${lng.toFixed(4)}`);
                });
            });
        }

        async function renderList(data) {
            const container = document.getElementById('requestList');
            if (!data.length) {
                container.innerHTML = '<div class="empty-msg">No pending applications.</div>';
                return;
            }
            container.innerHTML = '';
            for (const r of data) {
                const [pickupAddr, dropoffAddr] = await Promise.all([
                    geocodeLatLng(r.pickupLatitude, r.pickupLongitude),
                    geocodeLatLng(r.dropoffLatitude, r.dropoffLongitude)
                ]);

                const card = document.createElement('div');
                card.className = 'req-card';
                card.dataset.id = r.id;
                card.innerHTML = `
                    <div class="req-card-header">
                        <i class="bi bi-person-circle" style="color:#667eea"></i>
                        ${r.passengerName}
                    </div>
                    <div class="req-card-body">
                        <div class="req-loc">
                            <span class="req-loc-dot" style="background:#22c55e"></span>
                            <span><strong>Pickup:</strong> ${pickupAddr}</span>
                        </div>
                        <div class="req-loc">
                            <span class="req-loc-dot" style="background:#f97316"></span>
                            <span><strong>Drop-off:</strong> ${dropoffAddr}</span>
                        </div>
                    </div>
                    <div class="req-actions">
                        <a href="/profile/${r.passengerProfileId}" onclick="event.stopPropagation()"
                           style="flex:1;display:inline-flex;align-items:center;justify-content:center;gap:.3rem;
                                  padding:.4rem;border:1px solid #667eea;border-radius:8px;background:#f8f9ff;
                                  color:#667eea;text-decoration:none;font-size:.82rem;font-weight:600;transition:background .15s;"
                           onmouseover="this.style.background='#eef0fb'" onmouseout="this.style.background='#f8f9ff'">
                            <i class="bi bi-person-lines-fill"></i> Profile
                        </a>
                        <button class="btn-accept" onclick="handleRequest(${r.id}, 'accept', event)">
                            <i class="bi bi-check-lg"></i> Accept
                        </button>
                        <button class="btn-reject" onclick="handleRequest(${r.id}, 'reject', event)">
                            <i class="bi bi-x-lg"></i> Reject
                        </button>
                    </div>
                `;
                card.addEventListener('click', () => focusRequest(r));
                container.appendChild(card);
            }
        }

        function renderMarkers(data) {
            requestMarkers.forEach(m => m.setMap(null));
            requestMarkers = [];
            data.forEach(r => {
                requestMarkers.push(new google.maps.Marker({
                    position: { lat: r.pickupLatitude, lng: r.pickupLongitude },
                    map, title: r.passengerName + ' - Pickup',
                    icon: makeIcon('#22c55e', 'P')
                }));
                requestMarkers.push(new google.maps.Marker({
                    position: { lat: r.dropoffLatitude, lng: r.dropoffLongitude },
                    map, title: r.passengerName + ' - Drop-off',
                    icon: makeIcon('#f97316', 'D')
                }));
            });
        }

        function makeIcon(color, label) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="34">
                <rect x="0" y="0" width="26" height="26" rx="6" fill="${color}"/>
                <polygon points="8,26 18,26 13,34" fill="${color}"/>
                <text x="13" y="18" text-anchor="middle" fill="white" font-size="13" font-family="Arial" font-weight="bold">${label}</text>
            </svg>`;
            return {
                url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
                scaledSize: new google.maps.Size(26, 34),
                anchor: new google.maps.Point(13, 34)
            };
        }

        function focusRequest(r) {
            document.querySelectorAll('.req-card').forEach(c => c.classList.remove('selected'));
            document.querySelector(`.req-card[data-id="${r.id}"]`)?.classList.add('selected');
            map.panTo({ lat: r.pickupLatitude, lng: r.pickupLongitude });
            map.setZoom(13);
        }

        function handleRequest(requestId, action, event) {
            event.stopPropagation();
            fetch(`/api/ride-requests/${requestId}/${action}`, { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    if (data.error) {
                        showFeedback(data.error, 'error');
                    } else {
                        showFeedback(action === 'accept' ? 'Application accepted!' : 'Application rejected.', 'success');
                        loadRequests();
                    }
                })
                .catch(() => showFeedback('Something went wrong.', 'error'));
        }

        function showFeedback(msg, type) {
            const el = document.getElementById('feedbackMsg');
            el.textContent = msg;
            el.className = `feedback-msg ${type}`;
            el.classList.remove('d-none');
            setTimeout(() => el.classList.add('d-none'), 4000);
        }

        window.initMap = initMap;
    </script>
</div>
