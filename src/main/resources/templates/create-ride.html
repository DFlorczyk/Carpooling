<div th:fragment="content" xmlns:th="http://www.w3.org/1999/xhtml">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        .d-none { display: none !important; }

        .cr-wrap { max-width: 1200px; margin: 0 auto; }

        .cr-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 1.25rem;
        }

        /* ── Alerts ── */
        .alert {
            padding: .7rem 1.1rem;
            border-radius: 8px;
            font-size: .85rem;
            font-weight: 500;
            margin-bottom: 1.1rem;
        }
        .alert-success { background: #dcfce7; color: #16a34a; }
        .alert-danger  { background: #fee2e2; color: #dc2626; }

        /* ── Layout columns ── */
        .cr-columns {
            display: flex;
            gap: 1.5rem;
            align-items: flex-start;
        }
        .cr-form-panel { flex: 0 0 400px; }
        .cr-map-panel  { flex: 1; min-width: 0; }

        /* ── Cards ── */
        .cr-card {
            border: 1px solid #e8ecf5;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(102,126,234,.08);
        }
        .cr-card-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            padding: .7rem 1.1rem;
            font-size: .85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: .5rem;
        }
        .cr-card-body { padding: 1.1rem 1.25rem; }

        /* ── Fields ── */
        .cr-field { margin-bottom: 1.1rem; }
        .cr-field:last-of-type { margin-bottom: 0; }

        .cr-label {
            display: flex;
            align-items: center;
            gap: .45rem;
            font-size: .85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: .4rem;
        }
        .cr-label i.text-success { color: #22c55e; }
        .cr-label i.text-danger  { color: #ef4444; }
        .cr-label i:not(.text-success):not(.text-danger) { color: #667eea; }

        .cr-input {
            width: 100%;
            padding: .55rem .8rem;
            font-size: .9rem;
            color: #1e293b;
            border: 1px solid #dde1f0;
            border-radius: 8px;
            background: #f8f9ff;
            transition: border-color .15s, background .15s;
        }
        .cr-input:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
        }

        /* ── Route info ── */
        .route-info {
            border: 1px solid #e8ecf5;
            border-radius: 8px;
            background: #f8f9ff;
            padding: .6rem .9rem;
            margin-bottom: 1.1rem;
        }
        .route-info-label {
            font-size: .7rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: .05em;
            margin-bottom: .3rem;
        }
        .route-info-row {
            display: flex;
            justify-content: space-between;
            font-size: .85rem;
            font-weight: 600;
            color: #1e293b;
        }
        .route-info-row i { color: #667eea; }

        /* ── Submit button ── */
        .cr-submit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            width: 100%;
            padding: .65rem 1rem;
            margin-top: .5rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: .92rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity .15s;
        }
        .cr-submit:hover:not(:disabled) { opacity: .9; }
        .cr-submit:disabled { opacity: .6; cursor: not-allowed; }

        .spinner-border {
            display: inline-block;
            border: .2em solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: cr-spin .75s linear infinite;
        }
        .spinner-border-sm { width: 1rem; height: 1rem; border-width: .15em; }
        @keyframes cr-spin { to { transform: rotate(360deg); } }

        /* ── Map card ── */
        .map-card {
            border: 1px solid #e8ecf5;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(102,126,234,.08);
        }
        .map-header {
            padding: .6rem 1rem;
            background: rgba(102,126,234,.05);
            border-bottom: 1px solid #e8ecf5;
            font-size: .75rem;
            font-weight: 600;
            color: #667eea;
            text-transform: uppercase;
            letter-spacing: .06em;
            display: flex;
            align-items: center;
            gap: .4rem;
        }

        /* ── Map point selection toolbar ── */
        .map-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: .6rem;
            padding: .7rem 1rem;
            border-bottom: 1px solid #e8ecf5;
            background: #fff;
        }
        .map-select-btn {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            padding: .4rem .8rem;
            font-size: .8rem;
            font-weight: 600;
            color: #475569;
            background: #f8f9ff;
            border: 1px solid #dde1f0;
            border-radius: 8px;
            cursor: pointer;
            transition: background .15s, border-color .15s, color .15s;
        }
        .map-select-btn.start i { color: #22c55e; }
        .map-select-btn.end i { color: #ef4444; }
        .map-select-btn:hover { border-color: #667eea; background: #eef0fb; }
        .map-select-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: transparent;
            color: #fff;
        }
        .map-select-btn.active i { color: #fff; }

        .map-select-hint {
            font-size: .8rem;
            font-weight: 600;
            color: #667eea;
        }
    </style>

    <div class="cr-wrap">
        <div class="cr-title">Dodaj nowy przejazd</div>

        <div id="alertSuccess" class="alert alert-success d-none" role="alert"></div>
        <div id="alertError" class="alert alert-danger d-none" role="alert"></div>

        <div class="cr-columns">
            <div class="cr-form-panel">
                <div class="cr-card">
                    <div class="cr-card-header">
                        <i class="bi bi-signpost-split-fill"></i> Szczegóły przejazdu
                    </div>
                    <div class="cr-card-body">

                        <div class="cr-field">
                            <label class="cr-label" for="startAddress">
                                <i class="bi bi-geo-alt-fill text-success"></i> Miejsce startu
                            </label>
                            <input type="text" id="startAddress" class="cr-input"
                                   placeholder="Wpisz adres startowy..." autocomplete="off"/>
                        </div>

                        <div class="cr-field">
                            <label class="cr-label" for="endAddress">
                                <i class="bi bi-geo-alt-fill text-danger"></i> Miejsce docelowe
                            </label>
                            <input type="text" id="endAddress" class="cr-input"
                                   placeholder="Wpisz adres docelowy..." autocomplete="off"/>
                        </div>

                        <div class="cr-field">
                            <label class="cr-label" for="departureDate">
                                <i class="bi bi-calendar-event"></i> Data i godzina wyjazdu
                            </label>
                            <input type="datetime-local" id="departureDate" class="cr-input" required/>
                        </div>

                        <div class="cr-field">
                            <label class="cr-label" for="availableSeats">
                                <i class="bi bi-people-fill"></i> Liczba wolnych miejsc
                            </label>
                            <input type="number" id="availableSeats" class="cr-input"
                                   min="1" max="8" value="3"/>
                        </div>

                        <div id="routeInfo" class="route-info d-none">
                            <div class="route-info-label">Informacje o trasie</div>
                            <div class="route-info-row">
                                <span><i class="bi bi-signpost-2"></i> <span id="distanceInfo">-</span></span>
                                <span><i class="bi bi-clock"></i> <span id="durationInfo">-</span></span>
                            </div>
                            <div class="route-info-row" style="margin-top:.4rem;">
                                <span><i class="bi bi-fuel-pump"></i> Szacowany koszt paliwa</span>
                                <span id="costInfo">-</span>
                            </div>
                        </div>

                        <input type="hidden" id="cost"/>
                        <input type="hidden" id="startLatitude"/>
                        <input type="hidden" id="startLongitude"/>
                        <input type="hidden" id="endLatitude"/>
                        <input type="hidden" id="endLongitude"/>
                        <input type="hidden" id="encodedPolyline"/>
                        <input type="hidden" id="distanceKm"/>
                        <input type="hidden" id="durationMinutes"/>

                        <button id="submitRideBtn" class="cr-submit" onclick="submitRide()" disabled>
                            <i class="bi bi-plus-circle"></i> Dodaj przejazd
                        </button>
                    </div>
                </div>
            </div>

            <div class="cr-map-panel">
                <div class="map-card">
                    <div class="map-header">
                        <i class="bi bi-map"></i> Mapa trasy
                    </div>
                    <div class="map-toolbar">
                        <button type="button" id="selectStartBtn" class="map-select-btn start">
                            <i class="bi bi-geo-alt-fill"></i> Wybierz start na mapie
                        </button>
                        <button type="button" id="selectEndBtn" class="map-select-btn end">
                            <i class="bi bi-geo-alt-fill"></i> Wybierz cel na mapie
                        </button>
                        <span id="mapSelectHint" class="map-select-hint d-none"></span>
                    </div>
                    <div id="map" style="height: 550px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="'https://maps.googleapis.com/maps/api/js?key=' + ${googleMapsApiKey} + '&libraries=places&callback=initMap'"
            async defer></script>

    <script th:inline="javascript">
        let map, directionsService, directionsRenderer, geocoder;
        let startAutocomplete, endAutocomplete;
        let startMarker = null, endMarker = null;
        let mapSelectMode = null;

        let routeData = {
            startLat: null, startLng: null,
            endLat: null, endLng: null,
            startAddr: null, endAddr: null,
            distanceKm: null, durationMin: null,
            polyline: null
        };

        function initMap() {
            const defaultCenter = { lat: 52.2297, lng: 21.0122 };

            map = new google.maps.Map(document.getElementById('map'), {
                zoom: 7,
                center: defaultCenter,
                mapTypeControl: false,
                streetViewControl: false
            });

            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({
                map: map,
                suppressMarkers: true,
                polylineOptions: {
                    strokeColor: '#4285F4',
                    strokeWeight: 5
                }
            });
            geocoder = new google.maps.Geocoder();

            map.addListener('click', function (e) {
                if (!mapSelectMode) return;
                const role = mapSelectMode;
                setSelectMode(null);
                setPointFromLatLng(role, e.latLng);
            });

            document.getElementById('selectStartBtn').addEventListener('click', function () {
                setSelectMode(mapSelectMode === 'start' ? null : 'start');
            });
            document.getElementById('selectEndBtn').addEventListener('click', function () {
                setSelectMode(mapSelectMode === 'end' ? null : 'end');
            });

            startAutocomplete = new google.maps.places.Autocomplete(
                document.getElementById('startAddress'), {
                    types: ['geocode'],
                    componentRestrictions: { country: 'pl' }
                }
            );
            startAutocomplete.addListener('place_changed', function () {
                const place = startAutocomplete.getPlace();
                if (!place.geometry) return;

                routeData.startLat = place.geometry.location.lat();
                routeData.startLng = place.geometry.location.lng();
                routeData.startAddr = place.formatted_address;

                document.getElementById('startLatitude').value = routeData.startLat;
                document.getElementById('startLongitude').value = routeData.startLng;

                placeMarker('start', routeData.startLat, routeData.startLng);
                tryCalculateRoute();
            });

            endAutocomplete = new google.maps.places.Autocomplete(
                document.getElementById('endAddress'), {
                    types: ['geocode'],
                    componentRestrictions: { country: 'pl' }
                }
            );
            endAutocomplete.addListener('place_changed', function () {
                const place = endAutocomplete.getPlace();
                if (!place.geometry) return;

                routeData.endLat = place.geometry.location.lat();
                routeData.endLng = place.geometry.location.lng();
                routeData.endAddr = place.formatted_address;

                document.getElementById('endLatitude').value = routeData.endLat;
                document.getElementById('endLongitude').value = routeData.endLng;

                placeMarker('end', routeData.endLat, routeData.endLng);
                tryCalculateRoute();
            });
        }

        function setSelectMode(mode) {
            mapSelectMode = mode;

            document.getElementById('selectStartBtn').classList.toggle('active', mode === 'start');
            document.getElementById('selectEndBtn').classList.toggle('active', mode === 'end');

            const hint = document.getElementById('mapSelectHint');
            if (mode === 'start') {
                hint.textContent = 'Kliknij na mapie, aby ustawić miejsce startu';
                hint.classList.remove('d-none');
            } else if (mode === 'end') {
                hint.textContent = 'Kliknij na mapie, aby ustawić miejsce docelowe';
                hint.classList.remove('d-none');
            } else {
                hint.classList.add('d-none');
            }

            map.setOptions({ draggableCursor: mode ? 'crosshair' : null });
        }

        function placeMarker(role, lat, lng) {
            const position = { lat: lat, lng: lng };
            const icon = {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 8,
                fillColor: role === 'start' ? '#22c55e' : '#ef4444',
                fillOpacity: 1,
                strokeColor: '#fff',
                strokeWeight: 2
            };

            if (role === 'start') {
                if (startMarker) {
                    startMarker.setPosition(position);
                } else {
                    startMarker = new google.maps.Marker({
                        position: position, map: map, draggable: true, icon: icon, title: 'Miejsce startu'
                    });
                    startMarker.addListener('dragend', function (e) { setPointFromLatLng('start', e.latLng); });
                }
            } else {
                if (endMarker) {
                    endMarker.setPosition(position);
                } else {
                    endMarker = new google.maps.Marker({
                        position: position, map: map, draggable: true, icon: icon, title: 'Miejsce docelowe'
                    });
                    endMarker.addListener('dragend', function (e) { setPointFromLatLng('end', e.latLng); });
                }
            }
        }

        function setPointFromLatLng(role, latLng) {
            const lat = latLng.lat();
            const lng = latLng.lng();

            placeMarker(role, lat, lng);

            if (role === 'start') {
                routeData.startLat = lat;
                routeData.startLng = lng;
                document.getElementById('startLatitude').value = lat;
                document.getElementById('startLongitude').value = lng;
            } else {
                routeData.endLat = lat;
                routeData.endLng = lng;
                document.getElementById('endLatitude').value = lat;
                document.getElementById('endLongitude').value = lng;
            }

            geocoder.geocode({ location: { lat: lat, lng: lng } }, function (results, status) {
                const address = (status === 'OK' && results[0])
                    ? results[0].formatted_address
                    : lat.toFixed(5) + ', ' + lng.toFixed(5);

                if (role === 'start') {
                    routeData.startAddr = address;
                    document.getElementById('startAddress').value = address;
                } else {
                    routeData.endAddr = address;
                    document.getElementById('endAddress').value = address;
                }

                tryCalculateRoute();
            });
        }

        function tryCalculateRoute() {
            if (!routeData.startLat || !routeData.endLat) return;

            const request = {
                origin: { lat: routeData.startLat, lng: routeData.startLng },
                destination: { lat: routeData.endLat, lng: routeData.endLng },
                travelMode: google.maps.TravelMode.DRIVING
            };

            directionsService.route(request, function (result, status) {
                if (status === 'OK') {
                    directionsRenderer.setDirections(result);

                    const leg = result.routes[0].legs[0];
                    const distKm = (leg.distance.value / 1000).toFixed(1);
                    const durMin = Math.ceil(leg.duration.value / 60);
                    const polyline = result.routes[0].overview_polyline;

                    routeData.distanceKm = parseFloat(distKm);
                    routeData.durationMin = durMin;
                    routeData.polyline = polyline;

                    document.getElementById('distanceInfo').textContent = distKm + ' km';
                    document.getElementById('durationInfo').textContent = durMin + ' min';
                    document.getElementById('routeInfo').classList.remove('d-none');

                    document.getElementById('distanceKm').value = distKm;
                    document.getElementById('durationMinutes').value = durMin;
                    document.getElementById('encodedPolyline').value = polyline;

                    const FUEL_RATE = 3.5;
                    const estimatedCost = (parseFloat(distKm) * FUEL_RATE).toFixed(2);
                    document.getElementById('cost').value = estimatedCost;
                    document.getElementById('costInfo').textContent = estimatedCost + ' zł';

                    document.getElementById('submitRideBtn').disabled = false;
                } else {
                    alert('Nie udało się obliczyć trasy: ' + status);
                }
            });
        }

        function submitRide() {
            const departureDate = document.getElementById('departureDate').value;
            if (!departureDate) {
                showAlert('alertError', 'Podaj datę i godzinę wyjazdu.');
                return;
            }

            const payload = {
                startAddress: routeData.startAddr || document.getElementById('startAddress').value,
                startLatitude: routeData.startLat,
                startLongitude: routeData.startLng,
                endAddress: routeData.endAddr || document.getElementById('endAddress').value,
                endLatitude: routeData.endLat,
                endLongitude: routeData.endLng,
                departureDate: departureDate,
                cost: parseFloat(document.getElementById('cost').value) || 0,
                availableSeats: parseInt(document.getElementById('availableSeats').value) || 3,
                distanceKm: routeData.distanceKm,
                durationMinutes: routeData.durationMin,
                encodedPolyline: routeData.polyline
            };

            document.getElementById('submitRideBtn').disabled = true;
            document.getElementById('submitRideBtn').innerHTML =
                '<span class="spinner-border spinner-border-sm"></span> Dodawanie...';

            fetch('/api/rides', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    showAlert('alertError', data.error);
                    resetButton();
                } else {
                    showAlert('alertSuccess', 'Przejazd dodany pomyślnie! Przekierowanie...');
                    setTimeout(() => window.location.href = '/rides/' + data.rideId, 1500);
                }
            })
            .catch(err => {
                showAlert('alertError', 'Wystąpił błąd: ' + err.message);
                resetButton();
            });
        }

        function resetButton() {
            const btn = document.getElementById('submitRideBtn');
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-plus-circle"></i> Dodaj przejazd';
        }

        function showAlert(id, message) {
            const el = document.getElementById(id);
            el.textContent = message;
            el.classList.remove('d-none');
            setTimeout(() => el.classList.add('d-none'), 5000);
        }
    </script>
</div>
