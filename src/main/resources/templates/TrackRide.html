<div th:fragment="content" xmlns:th="http://www.w3.org/1999/xhtml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .cr-card { border: 1px solid #e8ecf5; border-radius: 12px; box-shadow: 0 2px 14px rgba(102,126,234,.08); background: white; }
        .cr-card-body { padding: 1.5rem; }
        .field-label { display: block; font-size: .75rem; font-weight: 600; color: #475569; text-transform: uppercase; letter-spacing: .04em; margin-bottom: .3rem; }
        .field-input { width: 100%; padding: .6rem .75rem; border: 1px solid #e2e8f0; border-radius: 8px; font-size: .9rem; outline: none; transition: .2s; }
        .field-input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,.15); }

        .submit-btn {
            width: 100%; padding: .75rem; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border: none; border-radius: 10px; font-size: .95rem; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: .5rem;
        }

        .range-container { background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
        input[type=range] { width: 100%; accent-color: #667eea; }

        .alert-box {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
            border: 1px solid;
            width: 100%;
        }
        .alert-error {
            background-color: #fee2e2;
            color: #b91c1c;
            border-color: #fecaca;
        }
        .alert-success {
            background-color: #dcfce7;
            color: #15803d;
            border-color: #bbf7d0;
        }
    </style>

    <div class="container" style="max-width: 1100px; margin: 0 auto; padding: 20px;">

        <div id="alertBox" class="alert-box"></div>

        <div style="display: flex; gap: 20px; align-items: flex-start;">

            <div class="cr-card" style="flex: 0 0 380px;">
                <div class="cr-card-body">
                    <h3 style="color: #1e293b; font-size: 1.1rem; margin-bottom: 1.2rem;">Track New Route</h3>

                    <div style="margin-bottom: 1rem;">
                        <label class="field-label"><i class="bi bi-geo-alt-fill text-success"></i> Start Location (A)</label>
                        <input type="text" id="startAddress" class="field-input" placeholder="Select on map..." readonly>
                    </div>

                    <div style="margin-bottom: 1rem;">
                        <label class="field-label"><i class="bi bi-geo-alt-fill text-danger"></i> Destination (B)</label>
                        <input type="text" id="endAddress" class="field-input" placeholder="Select on map..." readonly>
                    </div>

                    <div style="display: flex; gap: 10px; margin-bottom: 1rem;">
                        <div style="flex: 1;">
                            <label class="field-label"><i class="bi bi-calendar-event text-primary"></i> Date From</label>
                            <input type="date" id="startDate" class="field-input">
                        </div>
                        <div style="flex: 1;">
                            <label class="field-label"><i class="bi bi-calendar-check text-primary"></i> Date To</label>
                            <input type="date" id="endDate" class="field-input">
                        </div>
                    </div>

                    <div style="margin-bottom: 1.5rem;">
                        <label class="field-label"><i class="bi bi-radius text-primary"></i> Acceptance Radius: <span id="radiusVal" style="color: #667eea; font-weight: bold;">10</span> km</label>
                        <div class="range-container">
                            <input type="range" id="radius" min="1" max="50" value="10" oninput="document.getElementById('radiusVal').innerText = this.value">
                        </div>
                    </div>

                    <button class="submit-btn" onclick="saveTracker()">
                        <i class="bi bi-radar"></i> Start Tracking
                    </button>
                </div>
            </div>

            <div class="cr-card" style="flex: 1; height: 580px; overflow: hidden;">
                <div id="map" style="height: 100%; width: 100%;"></div>
            </div>
        </div>
    </div>

    <script th:src="'https://maps.googleapis.com/maps/api/js?key=' + ${googleMapsApiKey} + '&callback=initMap'" async defer></script>
    <script>
        let map, markerA, markerB;
        let step = 'A';

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                zoom: 6, center: {lat: 52.1, lng: 19.4},
                styles: [{ featureType: "poi", stylers: [{ visibility: "off" }] }]
            });

            map.addListener('click', (e) => {
                const latLng = e.latLng;
                if (step === 'A') {
                    if (markerA) markerA.setMap(null);
                    markerA = new google.maps.Marker({
                        position: latLng, map, label: { text: "A", color: "white", fontWeight: "bold" },
                        icon: { path: google.maps.SymbolPath.CIRCLE, scale: 12, fillColor: "#22c55e", fillOpacity: 1, strokeColor: "white", strokeWeight: 2 }
                    });
                    updateAddress('startAddress', latLng);
                    step = 'B';
                } else {
                    if (markerB) markerB.setMap(null);
                    markerB = new google.maps.Marker({
                        position: latLng, map, label: { text: "B", color: "white", fontWeight: "bold" },
                        icon: { path: google.maps.SymbolPath.CIRCLE, scale: 12, fillColor: "#ef4444", fillOpacity: 1, strokeColor: "white", strokeWeight: 2 }
                    });
                    updateAddress('endAddress', latLng);
                    step = 'A';
                }
            });
        }

        function updateAddress(id, latLng) {
            new google.maps.Geocoder().geocode({ location: latLng }, (results, status) => {
                if (status === 'OK' && results[0]) {
                    document.getElementById(id).value = results[0].formatted_address;
                }
            });
        }

        function showAlert(type, message) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerText = message;
            alertBox.className = 'alert-box ' + (type === 'error' ? 'alert-error' : 'alert-success');
            alertBox.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function saveTracker() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const startAddress = document.getElementById('startAddress').value;
            const endAddress = document.getElementById('endAddress').value;

            if (!markerA) {
                showAlert('error', 'Select a start point on the map (Point A).');
                return;
            }
            if (!markerB) {
                showAlert('error', 'Select a destination on the map (Point B).');
                return;
            }
            if (!startDate || !endDate) {
                showAlert('error', 'Please provide a date range for route tracking.');
                return;
            }

            const data = {
                startLatitude: markerA.getPosition().lat(),
                startLongitude: markerA.getPosition().lng(),
                endLatitude: markerB.getPosition().lat(),
                endLongitude: markerB.getPosition().lng(),
                startAddress: startAddress,
                endAddress: endAddress,
                startDate: startDate,
                endDate: endDate,
                radiusKm: document.getElementById('radius').value
            };

            fetch('/api/planned-rides', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            }).then(res => {
                if(res.ok) {
                    showAlert('success', 'Route tracking started! You will be notified of any matches.');
                    setTimeout(() => window.location.href='/profile', 2000);
                } else {
                    showAlert('error', 'An error occurred while saving the route. Please try again.');
                }
            });
        }
    </script>
</div>
