<div th:fragment="content" xmlns:th="http://www.w3.org/1999/xhtml">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* ── Layout ── */
        .rd-wrap { max-width: 1100px; margin: 0 auto; }

        .rd-columns {
            display: flex;
            gap: 1.5rem;
            align-items: flex-start;
        }
        .rd-info-panel { flex: 0 0 400px; }
        .rd-map-panel  { flex: 1; min-width: 0; }

        /* ── Back button ── */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            color: #667eea;
            text-decoration: none;
            font-size: .85rem;
            font-weight: 500;
            padding: .4rem .9rem;
            border: 1px solid #dde1f0;
            border-radius: 8px;
            background: #f8f9ff;
            margin-bottom: 1.25rem;
            transition: background .15s, border-color .15s;
        }
        .back-btn:hover { background: #eef0fb; border-color: #667eea; }

        .page-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 1.25rem;
        }

        /* ── Cards ── */
        .rd-card {
            border: 1px solid #e8ecf5;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(102,126,234,.08);
            margin-bottom: 1.25rem;
        }
        .rd-card:last-child { margin-bottom: 0; }

        .rd-card-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            padding: .7rem 1.1rem;
            font-size: .85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: .5rem;
        }
        .rd-card-header.light {
            background: #f8f9ff;
            color: #475569;
            border-bottom: 1px solid #e8ecf5;
        }

        .rd-card-body { padding: 1.1rem 1.25rem; }

        /* ── Route addresses ── */
        .addr-block { margin-bottom: .9rem; }
        .addr-block:last-child { margin-bottom: 0; }
        .addr-label {
            font-size: .7rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: .05em;
            margin-bottom: .2rem;
        }
        .addr-value {
            font-size: .92rem;
            font-weight: 600;
            color: #1e293b;
            display: flex;
            align-items: flex-start;
            gap: .4rem;
        }
        .addr-sep {
            display: flex;
            align-items: center;
            gap: .5rem;
            margin: .45rem 0;
            color: #cbd5e1;
            font-size: .8rem;
        }
        .addr-sep::before, .addr-sep::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e8ecf5;
        }

        /* ── Info rows ── */
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: .6rem 1.25rem;
            border-bottom: 1px solid #f1f5f9;
        }
        .info-row:last-child { border-bottom: none; }

        .info-row-label {
            display: flex;
            align-items: center;
            gap: .5rem;
            font-size: .85rem;
            color: #64748b;
        }
        .info-row-label i { color: #667eea; }

        .info-row-value {
            font-size: .88rem;
            font-weight: 600;
            color: #1e293b;
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: .3rem;
            padding: .22rem .65rem;
            border-radius: 20px;
            font-size: .78rem;
            font-weight: 600;
            background: #dcfce7;
            color: #16a34a;
        }

        /* ── Map card ── */
        .map-card {
            border: 1px solid #e8ecf5;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(102,126,234,.08);
        }
        .map-header {
            padding: .6rem 1rem;
            background: rgba(102,126,234,.05);
            border-bottom: 1px solid #e8ecf5;
            font-size: .75rem;
            font-weight: 600;
            color: #667eea;
            text-transform: uppercase;
            letter-spacing: .06em;
            display: flex;
            align-items: center;
            gap: .4rem;
        }
    </style>

    <div class="rd-wrap">

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;">
            <a href="/" class="back-btn" style="margin-bottom:0;">
                <i class="bi bi-arrow-left"></i> Powrót do listy
            </a>
            <a th:if="${isDriver}" th:href="'/rides/' + ${ride.id} + '/requests'"
               style="display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .9rem;
                      background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-radius:8px;
                      font-size:.85rem;font-weight:600;text-decoration:none;transition:opacity .15s;"
               onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">
                <i class="bi bi-person-check-fill"></i> View Applications
            </a>
        </div>

        <div class="page-title">Szczegóły przejazdu</div>

        <div class="rd-columns">

            <div class="rd-info-panel">

                <div class="rd-card">
                    <div class="rd-card-header">
                        <i class="bi bi-car-front-fill"></i> Trasa
                    </div>
                    <div class="rd-card-body">
                        <div class="addr-block">
                            <div class="addr-label">Skąd</div>
                            <div class="addr-value">
                                <i class="bi bi-circle-fill" style="color:#22c55e; font-size:.5rem; margin-top:.35rem; flex-shrink:0;"></i>
                                <span id="addr-start">Ładowanie…</span>
                            </div>
                        </div>
                        <div class="addr-sep"><i class="bi bi-three-dots-vertical"></i></div>
                        <div class="addr-block">
                            <div class="addr-label">Dokąd</div>
                            <div class="addr-value">
                                <i class="bi bi-geo-alt-fill" style="color:#ef4444; flex-shrink:0;"></i>
                                <span id="addr-end">Ładowanie…</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="rd-card">
                    <div class="rd-card-header light">
                        <i class="bi bi-info-circle"></i> Informacje
                    </div>
                    <div class="info-row">
                        <span class="info-row-label"><i class="bi bi-calendar-event"></i> Data wyjazdu</span>
                        <span class="info-row-value"
                              th:text="${#temporals.format(ride.departureDate, 'dd.MM.yyyy HH:mm')}">—</span>
                    </div>
                    <div class="info-row">
                        <span class="info-row-label"><i class="bi bi-cash"></i> Koszt</span>
                        <span class="info-row-value" th:text="${ride.cost + ' PLN'}">—</span>
                    </div>
                    <div class="info-row">
                        <span class="info-row-label"><i class="bi bi-people-fill"></i> Wolne miejsca</span>
                        <span class="info-row-value" th:text="${ride.availableSeats}">—</span>
                    </div>
                    <div class="info-row" th:if="${ride.distanceKm != null}">
                        <span class="info-row-label"><i class="bi bi-signpost-2"></i> Dystans</span>
                        <span class="info-row-value" th:text="${ride.distanceKm + ' km'}">—</span>
                    </div>
                    <div class="info-row" th:if="${ride.durationMinutes != null}">
                        <span class="info-row-label"><i class="bi bi-clock"></i> Czas przejazdu</span>
                        <span class="info-row-value" th:text="${ride.durationMinutes + ' min'}">—</span>
                    </div>
                    <div class="info-row">
                        <span class="info-row-label"><i class="bi bi-person-circle"></i> Kierowca</span>
                        <span class="info-row-value" th:text="${ride.driverName}">—</span>
                    </div>
                    <div class="info-row">
                        <span class="info-row-label"><i class="bi bi-tag"></i> Status</span>
                        <span class="status-chip">
                            <i class="bi bi-check-circle-fill" style="font-size:.7rem;"></i>
                            <span th:text="${ride.stateName}">—</span>
                        </span>
                    </div>
                </div>

            </div>

            <div class="rd-map-panel">
                <div class="map-card">
                    <div class="map-header">
                        <i class="bi bi-map"></i> Mapa trasy
                    </div>
                    <div id="detailMap" style="height: 510px;"></div>
                </div>
            </div>

        </div>
    </div>

    <script th:src="'https://maps.googleapis.com/maps/api/js?key=' + ${googleMapsApiKey} + '&callback=initDetailMap'"
            async defer></script>

    <script th:inline="javascript">
        const rideId       = /*[[${ride.id}]]*/ 0;
        const rideStartLat = /*[[${ride.startLatitude}]]*/ 0;
        const rideStartLng = /*[[${ride.startLongitude}]]*/ 0;
        const rideEndLat   = /*[[${ride.endLatitude}]]*/ 0;
        const rideEndLng   = /*[[${ride.endLongitude}]]*/ 0;

        function initDetailMap() {
            const startLatLng = { lat: rideStartLat, lng: rideStartLng };
            const endLatLng   = { lat: rideEndLat,   lng: rideEndLng   };

            const map = new google.maps.Map(document.getElementById('detailMap'), {
                zoom: 7,
                center: { lat: (rideStartLat + rideEndLat) / 2, lng: (rideStartLng + rideEndLng) / 2 },
                mapTypeControl: false,
                streetViewControl: false
            });

            // Geocode start / end addresses into the info panel
            const geocoder = new google.maps.Geocoder();
            geocoder.geocode({ location: startLatLng }, (res, st) => {
                const el = document.getElementById('addr-start');
                if (el) el.textContent = (st === 'OK' && res[0]) ? res[0].formatted_address : rideStartLat.toFixed(4) + ', ' + rideStartLng.toFixed(4);
            });
            geocoder.geocode({ location: endLatLng }, (res, st) => {
                const el = document.getElementById('addr-end');
                if (el) el.textContent = (st === 'OK' && res[0]) ? res[0].formatted_address : rideEndLat.toFixed(4) + ', ' + rideEndLng.toFixed(4);
            });

            const directionsService = new google.maps.DirectionsService();

            function makeSvgIcon(color, label) {
                const s = 26, r = 6, fs = label.length > 1 ? 9 : 12;
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s+8}">
                    <rect x="0" y="0" width="${s}" height="${s}" rx="${r}" fill="${color}"/>
                    <polygon points="${s/2-5},${s} ${s/2+5},${s} ${s/2},${s+8}" fill="${color}"/>
                    <text x="${s/2}" y="${s/2+fs/3+1}" text-anchor="middle" fill="white" font-size="${fs}" font-family="Arial" font-weight="bold">${label}</text>
                </svg>`;
                return { url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg), scaledSize: new google.maps.Size(s, s+8), anchor: new google.maps.Point(s/2, s+8) };
            }

            function placeMarker(position, color, label) {
                new google.maps.Marker({ position, map, icon: makeSvgIcon(color, label) });
            }

            // Fetch waypoints then draw the optimised route — same logic as the home page
            fetch(`/api/r/rides/${rideId}/waypoints`)
                .then(r => r.json())
                .then(waypoints => {
                    const stops = waypoints.map(wp => ({ location: { lat: wp.latitude, lng: wp.longitude }, stopover: true }));
                    directionsService.route({
                        origin: startLatLng, destination: endLatLng,
                        waypoints: stops, optimizeWaypoints: true,
                        travelMode: google.maps.TravelMode.DRIVING
                    }, (result, status) => {
                        if (status !== 'OK') return;
                        const route = result.routes[0];
                        const order = (route.waypoint_order && route.waypoint_order.length > 0)
                            ? route.waypoint_order
                            : waypoints.map((_, i) => i);
                        const orderedWaypoints = order.map(idx => waypoints[idx]);

                        route.legs.forEach((leg, i) => {
                            // Segment colour: green → PICKUP, orange → DROPOFF, blue → End
                            const color = i < orderedWaypoints.length
                                ? (orderedWaypoints[i].type === 'PICKUP' ? '#22c55e' : '#f97316')
                                : '#3b82f6';
                            const path = [];
                            leg.steps.forEach(step => { if (step.path) step.path.forEach(pt => path.push(pt)); });
                            if (path.length > 0) {
                                new google.maps.Polyline({ path, strokeColor: color, strokeWeight: 5, strokeOpacity: 0.85, map });
                            }
                        });

                        placeMarker(startLatLng, '#475569', 'S');
                        orderedWaypoints.forEach(wp => {
                            const isPickup = wp.type === 'PICKUP';
                            placeMarker({ lat: wp.latitude, lng: wp.longitude }, isPickup ? '#22c55e' : '#f97316', isPickup ? 'P' : 'D');
                        });
                        placeMarker(endLatLng, '#3b82f6', 'E');

                        map.fitBounds(route.bounds, { top: 40, right: 40, bottom: 40, left: 40 });
                    });
                });
        }
    </script>
</div>
