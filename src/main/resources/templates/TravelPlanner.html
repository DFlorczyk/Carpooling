<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" xmlns:th="http://www.w3.org/1999/xhtml">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        .tp-wrap { max-width: 560px; margin: 0 auto; }

        .tp-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 1.25rem;
        }

        .tp-card {
            border: 1px solid #e8ecf5;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(102,126,234,.08);
        }

        .tp-card-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            padding: .9rem 1.25rem;
            font-size: .95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: .5rem;
        }

        .tp-card-body { padding: 1.25rem; }

        .tp-field { margin-bottom: 1.1rem; }
        .tp-field:last-of-type { margin-bottom: 1.5rem; }

        .tp-label {
            display: flex;
            align-items: center;
            gap: .45rem;
            font-size: .85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: .4rem;
        }
        .tp-label i { color: #667eea; }

        .tp-input {
            width: 100%;
            padding: .55rem .8rem;
            font-size: .9rem;
            color: #1e293b;
            border: 1px solid #dde1f0;
            border-radius: 8px;
            background: #f8f9ff;
            transition: border-color .15s, background .15s;
        }
        .tp-input:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
        }

        .tp-submit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            width: 100%;
            padding: .65rem 1rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: .92rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity .15s;
        }
        .tp-submit:hover { opacity: .9; }
    </style>

    <div class="tp-wrap">
        <div class="tp-title">Plan Your Trip</div>

        <div class="tp-card">
            <div class="tp-card-header">
                <i class="bi bi-calendar-range"></i> Trip Schedule
            </div>
            <div class="tp-card-body">
                <form action="#" th:action="@{/travelPlanner}" th:object="${ev}" method="post">

                    <div class="tp-field">
                        <label class="tp-label" for="dateStartTime">
                            <i class="bi bi-calendar-event"></i> Start Date &amp; Time
                        </label>
                        <input type="datetime-local" id="dateStartTime" class="tp-input"
                               th:field="*{dateStartTime}"/>
                    </div>

                    <div class="tp-field">
                        <label class="tp-label" for="dateStartEnd">
                            <i class="bi bi-calendar-check"></i> End Date &amp; Time
                        </label>
                        <input type="datetime-local" id="dateStartEnd" class="tp-input"
                               th:field="*{dateStartEnd}"/>
                    </div>

                    <button type="submit" class="tp-submit">
                        <i class="bi bi-save"></i> Save
                    </button>
                </form>
            </div>
        </div>
    </div>

</div>
</body>
</html>
